<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Lanterns — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f0820; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#fff3d6;font:16px Georgia,serif;padding:24px">Twin Lanterns needs JavaScript to play.</p></noscript>
<canvas id="game" aria-label="Twin Lanterns: a spot the difference game. Two near-identical night festival scenes side by side; click the differences."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
